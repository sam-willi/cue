name: Bug
description: Something is broken (crash, connection error, UI problem).
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 141, macOS 26
