name: Feature or change
description: Propose new behavior for Cue.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is the user trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: context
    attributes:
      label: Fit with CUE_CONTEXT.md
      description: Does this touch a [CONFIRMED] decision, a [WORKING ASSUMPTION], or an [OPEN QUESTION]?
